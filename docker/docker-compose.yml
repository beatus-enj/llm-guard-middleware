version: "3.9"

services:
  # ── llm-guard 中间件 ─────────────────────────────────────────────────────
  llm-guard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      UPSTREAM_URL: http://llamacpp:8080
      PORT: "8000"
      ENABLE_RULE_ENGINE: "true"
      ENABLE_ML_MODEL: "false"
      ENABLE_STREAM_GUARD: "true"
      ENABLE_HOT_RELOAD: "true"
      HOT_RELOAD_POLL_SEC: "2"
      ALERT_BLOCK_RATIO_THRESHOLD: "0.5"
      ALERT_COOLDOWN_SEC: "300"
      # 可选：填写告警渠道
      # ALERT_WEBHOOK_URL: http://your-webhook/
      # ALERT_WEBHOOK_TYPE: wecom   # wecom|feishu|dingtalk|generic
    volumes:
      - ../config:/app/config          # 规则文件热更新
      - guard-model-cache:/app/model_cache
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - guard-net
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/guard/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── 模拟 llama.cpp（测试用，生产替换为真实实例）───────────────────────────
  llamacpp:
    image: python:3.12-slim
    command: >
      python3 -c "
      from http.server import BaseHTTPRequestHandler, HTTPServer
      import json, time
      class H(BaseHTTPRequestHandler):
          def log_message(self, *a): pass
          def do_POST(self):
              body = self.rfile.read(int(self.headers.get('Content-Length',0)))
              self.send_response(200)
              self.send_header('Content-Type','application/json')
              self.end_headers()
              resp = {'id':'chatcmpl-test','object':'chat.completion','created':int(time.time()),
                      'model':'llama3','choices':[{'index':0,'message':{'role':'assistant',
                      'content':'Hello from llama.cpp mock!'},'finish_reason':'stop'}],
                      'usage':{'prompt_tokens':10,'completion_tokens':20,'total_tokens':30}}
              self.wfile.write(json.dumps(resp).encode())
          def do_GET(self):
              self.send_response(200); self.end_headers()
              self.wfile.write(b'OK')
      HTTPServer(('0.0.0.0',8080), H).serve_forever()
      "
    ports:
      - "8080:8080"
    networks:
      - guard-net

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.11.3
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - guard-net
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.0.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: llmguard
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/llm-guard.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - guard-net
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  guard-model-cache:

networks:
  guard-net:
    driver: bridge
