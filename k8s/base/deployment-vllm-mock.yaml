apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp-mock
  namespace: llm-guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llamacpp
  template:
    metadata:
      labels:
        app: llamacpp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llamacpp
          image: python:3.12-slim
          command:
            - python3
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              import json, time
              class H(BaseHTTPRequestHandler):
                  def log_message(self, *a): pass
                  def do_POST(self):
                      self.rfile.read(int(self.headers.get('Content-Length', 0)))
                      self.send_response(200)
                      self.send_header('Content-Type', 'application/json')
                      self.end_headers()
                      resp = {'id':'chatcmpl-test','object':'chat.completion',
                              'created':int(time.time()),'model':'llama3',
                              'choices':[{'index':0,'message':{'role':'assistant',
                              'content':'Hello from llama.cpp!'},'finish_reason':'stop'}],
                              'usage':{'prompt_tokens':10,'completion_tokens':20,'total_tokens':30}}
                      self.wfile.write(json.dumps(resp).encode())
                  def do_GET(self):
                      self.send_response(200); self.end_headers(); self.wfile.write(b'OK')
              HTTPServer(('0.0.0.0', 8080), H).serve_forever()
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true  #非root运行
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: tmp-volume
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "256Mi"
        - name: tmp-volume
          emptyDir: {}