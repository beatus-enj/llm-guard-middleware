apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-guard
  namespace: llm-guard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-guard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: llm-guard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm-guard
          image: llm-guard:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # 仅从纯标量配置中导入环境变量，规避规则文本污染
          envFrom:
            - configMapRef:
                name: llm-guard-settings
            - secretRef:
                name: llm-guard-secret
          volumeMounts:
            - name: rules-volume
              mountPath: /app/config
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /guard/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /guard/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
      volumes:
        - name: rules-volume
          configMap:
            name: llm-guard-rules
        - name: tmp-volume
          emptyDir: {}
      terminationGracePeriodSeconds: 30