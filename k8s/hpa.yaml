apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: llm-guard-hpa
  namespace: llm-guard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: llm-guard
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # CPU > 70% 时扩容
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80