# 1. 瘦身安全网关
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-guard
  namespace: llm-guard
spec:
  replicas: 1 # 本地测试 1 个副本足够
  template:
    spec:
      containers:
        - name: llm-guard
          imagePullPolicy: Never # 🛠️ 关键：直接读取本地 docker build 的镜像，不走 Registry
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
# 2. 瘦身 Mock 推理服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp-mock
  namespace: llm-guard
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: llamacpp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "64Mi" # 本地 Mock 不需要太大的共享内存
---
# 3. 将网关暴露到本地端口
apiVersion: v1
kind: Service
metadata:
  name: llm-guard-service
  namespace: llm-guard
spec:
  type: NodePort # 🛠️ 关键：改为 NodePort，方便本地直接访问
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080 # 固定本地映射端口为 30080